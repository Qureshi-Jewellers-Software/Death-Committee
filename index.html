<style>
:root{--g:#0a9a4a;--gd:#067a39;--gl:#e7f7ee;--bg:#f2f4f3;--tx:#1d2b24;--mut:#6b7a72;--red:#d93838;--redl:#fdecec;--or:#e98a15;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--tx);padding-bottom:78px;font-size:15px}
body.ur *{font-family:"Noto Nastaliq Urdu",system-ui,sans-serif}
body.ur{line-height:1.9}
body.ur .amt,body.ur .amt-g,body.ur .amt-r,body.ur input{font-family:system-ui,sans-serif}
header{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;padding:16px 16px 54px;border-radius:0 0 22px 22px}
header .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:18px;font-weight:700}
header small{opacity:.85}
.bal{background:#fff;color:var(--tx);margin:-42px 14px 12px;border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.bal .lbl{color:var(--mut);font-size:13px}
.bal .amt{font-size:28px;font-weight:800;color:var(--gd);margin-top:2px}
.row{display:flex;gap:10px}.row>*{flex:1}
.mini{background:var(--gl);border-radius:12px;padding:10px;margin-top:10px}
.mini b{display:block;font-size:16px}.mini span{font-size:12px;color:var(--mut)}
.wrap{padding:0 14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tile{background:#fff;border-radius:14px;padding:12px 4px;text-align:center;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.05);cursor:pointer}
.tile .ic{width:42px;height:42px;border-radius:50%;background:var(--gl);color:var(--gd);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:20px}
h2{font-size:16px;margin:14px 0 8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eef1ef}
.item:last-child{border-bottom:0}
.item .n{font-weight:600}.item .s{font-size:12px;color:var(--mut)}
.amt-g{color:var(--gd);font-weight:700}.amt-r{color:var(--red);font-weight:700}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--gl);color:var(--gd);white-space:nowrap}
.badge.r{background:var(--redl);color:var(--red)}.badge.o{background:#fff3e2;color:var(--or)}
button{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer;background:var(--g);color:#fff}
button.sec{background:var(--gl);color:var(--gd)}button.red{background:var(--red)}button.wa{background:#25d366}
button.sm{padding:6px 10px;font-size:13px}
button.full{width:100%;margin-top:8px}
button.hb{background:rgba(255,255,255,.2);color:#fff;padding:7px 11px;font-size:14px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d6ddd9;border-radius:10px;font-size:15px;margin:4px 0 10px;background:#fff}
label{font-size:13px;color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;box-shadow:0 -2px 10px rgba(0,0,0,.07);z-index:5}
nav a{flex:1;text-align:center;padding:8px 0 10px;font-size:11px;color:var(--mut);text-decoration:none;cursor:pointer}
nav a .ic{font-size:20px;display:block}
nav a.on{color:var(--g);font-weight:700}
.fab{position:fixed;right:18px;bottom:88px;width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 4px 12px rgba(10,154,74,.4);z-index:6}
[dir=rtl] .fab{right:auto;left:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:10}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
.sheet h3{margin-bottom:12px}
.search{margin:0 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow:auto}
.tabs span{padding:7px 12px;border-radius:20px;background:#fff;font-size:13px;white-space:nowrap;cursor:pointer}
.tabs span.on{background:var(--g);color:#fff}
.empty{text-align:center;color:var(--mut);padding:24px 0}
.demo{background:#fff3e2;color:#8a5200;font-size:12px;text-align:center;padding:6px}
#login{max-width:380px;margin:60px auto;padding:0 18px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1d2b24;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:20}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:10px}.chk input{width:auto;margin:0}
.lang{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:10px;padding:16px;font-size:17px;background:var(--gl);color:var(--gd);border:2px solid transparent}
.lang.on{border-color:var(--g)}
.lang .ur{font-family:"Noto Nastaliq Urdu",serif;font-size:19px}
button[disabled]{opacity:.4}
#printArea{display:none}
.burger{font-size:20px;padding:6px 12px}
#dOver{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none}
#drawer{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;background:#fff;z-index:31;transform:translateX(-105%);transition:transform .25s;overflow:auto;display:flex;flex-direction:column}
[dir=rtl] #drawer{left:auto;right:0;transform:translateX(105%)}
#drawer.on{transform:none}#dOver.on{display:block}
#drawer .dh{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;padding:22px 16px}
#drawer .dh b{font-size:18px;display:block}#drawer .dh small{opacity:.85}
#drawer a{display:flex;align-items:center;gap:12px;padding:13px 18px;color:var(--tx);text-decoration:none;cursor:pointer;font-size:15px}
#drawer a:active,#drawer a.on{background:var(--gl);color:var(--gd)}
#drawer .sep{height:1px;background:#eef1ef;margin:6px 0}
#drawer a.out{color:var(--red);margin-top:auto;border-top:1px solid #eef1ef}
.pc{max-width:420px;margin:20px auto;border:2px solid var(--g);border-radius:14px;overflow:hidden;font-size:14px}
.pc .ph{background:var(--g);color:#fff;text-align:center;padding:12px;font-weight:700;font-size:18px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pc table{width:100%;border-collapse:collapse}.pc td{padding:7px 12px;border-bottom:1px solid #e3e8e5;vertical-align:top}.pc td:first-child{color:#555;width:42%}
.pc .sig{padding:22px 12px 12px;text-align:end}
@media print{body{padding:0;background:#fff}body>*:not(#printArea){display:none!important}#printArea{display:block!important}}
</style>

/* ================= DATA LAYER ================= */
let sb=null, DEMO=!SUPABASE_URL, ROWS=[];
const LS='dc_records_v1';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function list(kind){return ROWS.filter(r=>r.kind===kind).map(r=>({...r.data,id:r.id}))}
function get(id){const r=ROWS.find(x=>x.id===id);return r?{...r.data,id:r.id}:null}
async function save(kind,obj){
  const id=obj.id||uid(); const data={...obj}; delete data.id;
  const row={id,kind,data};
  const i=ROWS.findIndex(r=>r.id===id); if(i>=0)ROWS[i]=row; else ROWS.push(row);
  if(DEMO) localStorage.setItem(LS,JSON.stringify(ROWS));
  else { const {error}=await sb.from('records').upsert({id,kind,data,updated_at:new Date().toISOString()}); if(error){alert(L('Save nahi hua')+': '+error.message);} }
  return id;
}
async function del(id){
  ROWS=ROWS.filter(r=>r.id!==id);
  if(DEMO) localStorage.setItem(LS,JSON.stringify(ROWS));
  else { const {error}=await sb.from('records').delete().eq('id',id); if(error)alert(error.message); }
}
async function loadAll(){
  if(DEMO){ROWS=JSON.parse(localStorage.getItem(LS)||'[]');return}
  let all=[],from=0;
  while(true){const {data,error}=await sb.from('records').select('id,kind,data').range(from,from+999);
    if(error){alert(error.message);break} all=all.concat(data); if(data.length<1000)break; from+=1000;}
  ROWS=all;
}
function drawLogin(){
  $('#login').innerHTML=`<div style="text-align:right"><button class="sm sec" onclick="langPop()">🌐 ${LN[LANG]}</button></div>
  <h1 style="color:var(--gd);margin-bottom:6px">Death Committee</h1>
  <p style="color:var(--mut);margin-bottom:16px">${L('Login karein')}</p>
  <label>${L('Email')}</label><input id="lemail" type="email">
  <label>${L('Password')}</label><input id="lpass" type="password">
  <button class="full" onclick="doLogin()">${L('Login')}</button>
  <p id="lerr" style="color:var(--red);margin-top:10px"></p>`;
}
async function start(){
  applyLang();
  if(!localStorage.getItem('dc_lang'))langPop();
  if(!DEMO){
    sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const {data}=await sb.auth.getSession();
    if(!data.session){drawLogin();$('#login').style.display='block';return}
  }
  await loadAll(); boot();
}
async function doLogin(){
  const {error}=await sb.auth.signInWithPassword({email:lemail.value.trim(),password:lpass.value});
  if(error){lerr.textContent=L('Email ya password ghalat hai');return}
  $('#login').style.display='none'; await loadAll(); boot();
}
async function logout(){ if(sb) await sb.auth.signOut(); location.reload(); }

/* ================= CALCULATIONS ================= */
function totals(from,to){
  const inR=d=>(!from||d>=from)&&(!to||d<=to);
  const sum=k=>list(k).filter(p=>inR(p.date)).reduce((a,p)=>a+(+p.amount||0),0);
  const pay=sum('payment'),inc=sum('income'),lr=sum('loanpay'),dth=sum('death'),ln=sum('loan'),exp=sum('expense'),spay=sum('spay');
  const fine=list('payment').filter(p=>inR(p.date)).reduce((a,p)=>a+(+p.fine||0),0);
  const open=from?0:S().openCash+S().openBank;
  const IN=pay+fine+spay+inc+lr,OUT=dth+ln+exp;
  return {pay,fine,spay,inc,lr,dth,ln,exp,open,in:IN,out:OUT,bal:open+IN-OUT};
}
function accBal(){
  const s=S(),b={cash:s.openCash,bank:s.openBank};
  const add=(k,sign,f)=>list(k).forEach(x=>{b[acctOf(x)]+=sign*(f?f(x):(+x.amount||0))});
  add('payment',1,x=>(+x.amount||0)+(+x.fine||0));add('spay',1);add('income',1);add('loanpay',1);
  add('death',-1);add('loan',-1);add('expense',-1);
  list('transfer').forEach(t=>{const a=+t.amount||0;if(t.dir==='c2b'){b.cash-=a;b.bank+=a}else{b.bank-=a;b.cash+=a}});
  return b;
}
function dueDateOf(month){return month+'-'+String(S().dueDay).padStart(2,'0')}
function coverDate(m){return addM(ym(m.joined||today()),S().waitM)+'-'+(m.joined||today()).slice(8,10)}
function inWait(m){return S().waitM>0&&today()<coverDate(m)}
function lapsed(m){const n=S().lapse;return n>0&&memberArrears(m).length>=n}
function fineInfo(m){ // fine incurred for months not fully paid by their due date
  const s=S();if(!s.fine||m.active===false)return {inc:0,paid:0,due:0};
  let mm=ym(m.joined||today()),inc=0;const t=today();
  while(mm<=ym()){const dd=dueDateOf(mm);if(t>dd){const amt=+m.amount||s.defAmount;
      const onTime=list('payment').filter(p=>p.member===m.id&&p.month===mm&&p.date<=dd).reduce((a,p)=>a+(+p.amount||0),0);
      if(onTime<amt)inc+=s.fine;}mm=addM(mm,1)}
  const paid=list('payment').filter(p=>p.member===m.id).reduce((a,p)=>a+(+p.fine||0),0);
  return {inc,paid,due:Math.max(0,inc-paid)};
}
function specialDue(d){if(!(+d.special))return [];
  return list('member').filter(m=>m.active!==false&&(!m.joined||m.joined<=d.date)&&m.id!==d.member).map(m=>({m,paid:list('spay').filter(p=>p.death===d.id&&p.member===m.id).reduce((a,p)=>a+(+p.amount||0),0)}));}
function paidFor(memberId,month){return list('payment').filter(p=>p.member===memberId&&p.month===month).reduce((a,p)=>a+(+p.amount||0),0)}
function dueList(month){
  return list('member').filter(m=>m.active!==false&&(!m.joined||ym(m.joined)<=month)).map(m=>{
    const amt=+m.amount||S().defAmount, paid=paidFor(m.id,month);
    return {m,amt,paid,left:amt-paid};
  }).filter(x=>x.left>0);
}
function memberArrears(m){
  if(m.active===false)return [];
  const cur=ym(); let mm=ym(m.joined||today()), out=[];
  while(mm<=cur){const amt=+m.amount||S().defAmount,left=amt-paidFor(m.id,mm);if(left>0)out.push({month:mm,left});mm=addM(mm,1)}
  return out;
}
function loanLeft(l){return (+l.amount||0)-list('loanpay').filter(p=>p.loan===l.id).reduce((a,p)=>a+(+p.amount||0),0)}

function paidUpTo(m){let mm=ym(m.joined||today()),last=null;const amt=+m.amount||S().defAmount;for(let i=0;i<240;i++){if(paidFor(m.id,mm)>=amt){last=mm;mm=addM(mm,1)}else break}return last}
function advBadge(m){const u=paidUpTo(m);return u&&u>ym()?`<span class="badge">✅ ${mLabel(u)} ${L('tak ada')}</span>`:''}
function statusBadge(m){const ar=memberArrears(m);
  if(m.died)return `<span class="badge r">${L('Faut')}</span>`;
  if(m.left)return `<span class="badge o">${L('Chhor diya')}</span>`;
  if(m.active===false)return `<span class="badge o">${L('Band')}</span>`;
  if(lapsed(m))return `<span class="badge r">${L('Membership khatam')}</span>`;
  if(ar.length)return `<span class="badge r">${ar.length} ${L('mahine baqi')}</span>`;
  if(advBadge(m))return advBadge(m);
  if(inWait(m))return `<span class="badge o">${L('Intezar mein')}</span>`;
  return `<span class="badge">${L('Clear')}</span>`}

async function saveMember(id){
  if(!val('f_name'))return alert(L('Naam likhein'));
  const fam=readFam(),s=S(),old=id?get(id):{},fe=document.getElementById('f_family');
  if(s.maxFam&&fam.filter(f=>!f.died).length>s.maxFam&&!confirm(L('Afraad ki had se ziyada hain. Phir bhi save karein?')))return;

async function saveDeath(id){

  const mm=get(val('f_member'));
  const acc=$('#f_acc').checked,who=document.getElementById('f_who')?val('f_who'):'';
  if(!id&&!acc&&inWait(mm)&&!confirm(L('Yeh member abhi intezar ki muddat mein hai. Phir bhi save karein?')))return;
  if(!id&&lapsed(mm)&&!confirm(L('Is member ki membership khatam hai. Phir bhi save karein?')))return;
  const c={};document.querySelectorAll('.dc').forEach(i=>{if(+i.value)c[i.dataset.k]=+i.value});
  const nid=await save('death',{id:id||undefined,member:val('f_member'),name:val('f_name'),relation:val('f_rel'),date:val('f_date'),jtime:val('f_jtime'),jplace:val('f_jplace'),acct:val('f_acct'),special:+val('f_special')||0,c,amount:dTot(),note:val('f_note'),accident:acc,who});
  if(!id&&who!==''){const m2=get(mm.id);if(who==='self'){if(confirm(L('Member khud faut hue. Membership band kar dein?')))await save('member',{...m2,active:false,died:val('f_date')})}

}

  <label>${L('Itne mahine baqi hon to membership khatam (0 = kabhi nahi)')}</label><input id="s_lapse" type="number" min="0" value="${s.lapse}">
  <label>${L('Ziyada se ziyada afraad (0 = koi had nahi)')}</label><input id="s_maxfam" type="number" min="0" value="${s.maxFam}">
  <label>${L('Shamil hone ki ziyada se ziyada umar (0 = koi had nahi)')}</label><input id="s_maxage" type="number" min="0" value="${s.maxAge}">
  <b style="display:block;margin:6px 0">💰 ${L('Muqarrar raqam (rishte ke hisaab se)')}</b>
  ${BENK.map(([k,l])=>`<div class="row"><label style="flex:1.2;padding-top:14px">${L(l)}</label><input id="s_ben_${k}" type="number" min="0" value="${s.ben[k]||''}"></div>`).join('')}
  <button class="full" onclick="saveSet()">${L('Save')}</button></div>
  <div class="card"><b>📱 ${L('App phone par install karein')}</b><p style="color:var(--mut);font-size:13px;margin-top:4px">${L('Chrome menu (⋮) mein "Add to Home screen" dabayein')}</p>${window._inst?`<button class="full" onclick="_inst.prompt()">📱 ${L('App phone par install karein')}</button>`:''}</div>
  <div class="card"><b>🌐 ${L('Zubaan / Language')}</b><button class="full sec" onclick="langPop()">${LN[LANG]}</button></div>
  <div class="card"><b>${L('Backup')}</b><p style="color:var(--mut);font-size:13px;margin:4px 0">${L('Saara data ek file mein')}</p>
  <button class="full sec" onclick="backup()">⬇️ ${L('Backup file')}</button>
  <label style="display:block;margin-top:10px">${L('Backup wapas laana (restore)')}</label><input type="file" accept=".json" onchange="restore(this.files[0])"></div>
  <div class="card"><b>📥 ${L('Purana register Excel se')}</b><p style="color:var(--mut);font-size:13px;margin:4px 0">${L('Pehle template download karein, us mein members likh kar yahan upload karein.')}</p>
  <button class="full sec" onclick="importTpl()">⬇️ ${L('Template download')}</button>
  <label style="display:block;margin-top:10px">${L('File chunein (Excel ya CSV)')}</label><input type="file" accept=".xlsx,.xls,.csv" onchange="importReg(this.files[0])"></div></div>`;
};
async function saveSet(){const s=S();await save('settings',{id:s.id,name:val('s_name')||'Death Committee',dueDay:Math.min(28,Math.max(1,+val('s_due')||10)),defAmount:+val('s_amt')||500,phone:val('s_phone'),
  collectors:val('s_coll'),openCash:+val('s_oc')||0,openBank:+val('s_ob')||0,waitM:+val('s_wait')||0,fine:+val('s_fine')||0,lapse:+val('s_lapse')||0,maxFam:+val('s_maxfam')||0,maxAge:+val('s_maxage')||0,ben:Object.fromEntries(BENK.map(([k])=>[k,+val('s_ben_'+k)||0])),lastBackup:s.lastBackup});$('#cName').textContent=S().name;toast(L('Settings save'))}
function backup(){const s=list('settings')[0]||{};save('settings',{...s,lastBackup:new Date().toISOString()});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(ROWS)],{type:'application/json'}));a.download='death-committee-backup-'+today()+'.json';a.click()}
const IMPH=['Member No','Naam','Walid / Shohar','Phone','CNIC','Pata','Mahana chanda','Shamil (YYYY-MM-DD)','Ada shuda aakhri mahina (YYYY-MM)'];
function importTpl(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([IMPH,[1,'Muhammad Ali','Ahmed Ali','03001234567','42101-1234567-1','Gali 5',500,'2024-01-01','2026-10']]),'Members');XLSX.writeFile(wb,'Members-template.xlsx')}
async function importReg(f){if(!f)return;const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true});
  const h=rows[0].map(x=>String(x||'').toLowerCase()),col=k=>h.findIndex(x=>x.includes(k));
  const c={no:col('no'),name:col('naam'),father:col('walid'),phone:col('phone'),cnic:col('cnic'),addr:col('pata'),amt:col('chanda'),join:col('shamil'),paid:col('ada')};
  const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const nd=v=>{if(v instanceof Date)return dstr(v);v=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(0,10);const d=new Date(v);return isNaN(d)?today():d.toISOString().slice(0,10)};
  let n=0;for(const r of rows.slice(1)){const gr=k=>c[k]>=0?r[c[k]]:'',g=k=>{const v=gr(k);return v instanceof Date?dstr(v):String(v??'').trim()};if(!g('name'))continue;
    const joined=nd(gr('join')),amt=+g('amt')||S().defAmount;
    const id=await save('member',{no:g('no'),name:g('name'),father:g('father'),phone:(x=>/^3\d{9}$/.test(x)?'0'+x:x)(g('phone')),cnic:g('cnic'),address:g('addr'),amount:amt,joined,active:true,fam:[]});n++;
    const pu=g('paid').slice(0,7);if(/^\d{4}-\d{2}$/.test(pu)){let mm=ym(joined);while(mm<=pu){await save('payment',{member:id,month:mm,amount:amt,date:joined>mm+'-01'?joined:mm+'-01',method:'cash',note:'import'});mm=addM(mm,1)}}}
  toast(n+' '+L('members shamil ho gaye'));go('members')}
async function restore(f){if(!f||!confirm(L('Backup ka data shamil karein?')))return;const rows=JSON.parse(await f.text());for(const r of rows)await save(r.kind,{...r.data,id:r.id});toast(L('Restore ho gaya'));go('home')}

/* ---------- REPORTS / EXCEL ---------- */
V.reports=()=>{
  const y=new Date().getFullYear(),ys=[];for(let i=y;i>=y-5;i--)ys.push(i);
  $('#view').innerHTML=`<div class="bal"><div class="lbl">${L('Excel report')}</div><div class="amt" style="font-size:18px">${L('Mahana · 3 mahine · 6 mahine · Saal')}</div></div>
  <div class="wrap"><div class="card">
  <label>${L('Report ki qisam')}</label><select id="r_t" onchange="rOpts()"><option value="m">${L('Mahana')}</option><option value="q">${L('Quarterly (3 mahine)')}</option><option value="h">${L('6 mahine')}</option><option value="y">${L('Saalana')}</option></select>
  <label>${L('Saal')}</label><select id="r_y" onchange="rPrev()">${ys.map(v=>`<option>${v}</option>`).join('')}</select>
  <div id="r_pbox"><label>${L('Kaunsa')}</label><select id="r_p" onchange="rPrev()"></select></div>
  <div id="r_prev" class="card" style="background:var(--gl)"></div>
  <button class="full" onclick="exportX()">⬇️ ${L('Excel download')}</button>
  <button class="full wa" onclick="sendSummary(rRange().months.length===1?rRange().months[0]:null)">📲 ${L('Mahana hisaab WhatsApp par')}</button></div>
  <h2>📈 ${L('Aamdani aur kharch (12 mahine)')}</h2><div class="card">${chart12()}</div></div>`;
  rOpts();
};
function chart12(){const ms=[];for(let i=11;i>=0;i--)ms.push(addM(ym(),-i));const d=ms.map(m=>{const t=totals(m+'-01',m+'-31');return {m,i:t.in,o:t.out}});const mx=Math.max(1,...d.map(x=>Math.max(x.i,x.o)));
  return `<div style="display:flex;gap:12px;font-size:12px;margin-bottom:8px"><span><i style="display:inline-block;width:10px;height:10px;background:var(--g);border-radius:2px"></i> ${L('Aamdani')}</span><span><i style="display:inline-block;width:10px;height:10px;background:var(--red);border-radius:2px"></i> ${L('Kharch')}</span></div>
  <div style="display:flex;align-items:flex-end;gap:4px;height:150px;direction:ltr">${d.map(x=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end" title="${mLabel(x.m)}: ${rs(x.i)} / ${rs(x.o)}" onclick="toast('${mLabel(x.m)}: +${rs(x.i)} / -${rs(x.o)}')">
   <div style="display:flex;align-items:flex-end;gap:1px;height:130px;width:100%"><div style="flex:1;background:var(--g);border-radius:3px 3px 0 0;height:${x.i/mx*100}%"></div><div style="flex:1;background:var(--red);border-radius:3px 3px 0 0;height:${x.o/mx*100}%"></div></div>
   <div style="font-size:9px;color:var(--mut);margin-top:3px">${MN[LANG][+x.m.slice(5)-1].slice(0,LANG==='ur'?6:3)}</div></div>`).join('')}</div>`}
function rOpts(){const t=val('r_t'),p=$('#r_p'),M=MN[LANG];$('#r_pbox').style.display=t==='y'?'none':'block';
  p.innerHTML=t==='m'?M.map((m,i)=>`<option value="${i}" ${i===new Date().getMonth()?'selected':''}>${m}</option>`).join('')
   :t==='q'?[0,1,2,3].map(i=>`<option value="${i}">Q${i+1} (${M[i*3]} - ${M[i*3+2]})</option>`).join('')
   :[L('Pehle 6 mahine (Jan-Jun)'),L('Doosre 6 mahine (Jul-Dec)')].map((m,i)=>`<option value="${i}">${m}</option>`).join('');rPrev()}
function rRange(){const t=val('r_t'),y=+val('r_y'),p=+($('#r_p').value||0);let s,n;
  if(t==='m'){s=p;n=1}else if(t==='q'){s=p*3;n=3}else if(t==='h'){s=p*6;n=6}else{s=0;n=12}
  const months=[];for(let i=0;i<n;i++)months.push(y+'-'+String(s+i+1).padStart(2,'0'));
  return {months,from:months[0]+'-01',to:months[n-1]+'-31',label:t==='y'?L('Saal')+' '+y:n===1?mLabel(months[0]):mLabel(months[0])+' '+L('se')+' '+mLabel(months[n-1])}}
function rPrev(){const r=rRange(),t=totals(r.from,r.to);
  $('#r_prev').innerHTML=`<b>${r.label}</b><div class="item"><span>${L('Chanda')}</span><span class="amt-g">${rs(t.pay)}</span></div><div class="item"><span>${L('Khaas chanda')} + ${L('Jurmana')}</span><span class="amt-g">${rs(t.spay+t.fine)}</span></div><div class="item"><span>${L('Doosri aamdani + loan wapsi')}</span><span class="amt-g">${rs(t.inc+t.lr)}</span></div><div class="item"><span>${L('Wafat kharch')}</span><span class="amt-r">${rs(t.dth)}</span></div><div class="item"><span>${L('Loan diye')}</span><span class="amt-r">${rs(t.ln)}</span></div><div class="item"><span>${L('Doosre kharche')}</span><span class="amt-r">${rs(t.exp)}</span></div><div class="item"><b>${L('Bachat')}</b><b>${rs(t.bal)}</b></div>`}
function exportX(){
  const r=rRange(),t=totals(r.from,r.to),inR=d=>d>=r.from&&d<=r.to,s=S(),wb=XLSX.utils.book_new();
  const opening=totals(null,addM(r.months[0],-1)+'-31').bal;
  const add=(name,rows)=>{const ws=XLSX.utils.aoa_to_sheet(rows.length>1?rows:[...rows,[L('(koi record nahi)')]]);if(LANG==='ur')ws['!views']=[{RTL:true}];XLSX.utils.book_append_sheet(wb,ws,L(name).slice(0,31))};
  const H=a=>a.map(L);
  add('Khulasa',[[s.name+' - '+r.label],[],[L('Shuru ka balance'),opening],[L('Chanda'),t.pay],[L('Jurmana'),t.fine],[L('Khaas chanda'),t.spay],[L('Doosri aamdani'),t.inc],[L('Loan wapsi'),t.lr],[L('Kul aamdani'),t.in],[],[L('Wafat kharch'),t.dth],[L('Loan diye'),t.ln],[L('Doosre kharche'),t.exp],[L('Kul kharch'),t.out],[],[L('Is muddat ki bachat'),t.bal],[L('Aakhri balance'),opening+t.bal],[],[L('Cash (haath mein)')+' ('+fd(today())+')',accBal().cash],[L('Bank / Easypaisa')+' ('+fd(today())+')',accBal().bank]]);
  add('Chanda',[H(['Tareekh','Member No','Member','Mahina','Raqam','Jurmana','Tareeqa','Txn ID','Wasooli','Note']),...list('payment').filter(p=>inR(p.date)).sort((a,b)=>a.date.localeCompare(b.date)).map(p=>{const m=get(p.member)||{};return [p.date,m.no||'',m.name||'',mLabel(p.month),+p.amount,+p.fine||0,p.method==='online'?L('Online'):L('Cash'),p.txn||'',p.coll||'',p.note||'']})]);
  add('Khaas chande',[H(['Tareekh','Marhoom','Member','Raqam','Account','Wasooli']),...list('spay').filter(p=>inR(p.date)).map(p=>[p.date,(get(p.death)||{}).name||'',memName(p.member),+p.amount,acctTxt(acctOf(p)),p.coll||''])]);
  const cg={};[...list('payment'),...list('spay')].filter(p=>inR(p.date)&&p.coll).forEach(p=>cg[p.coll]=(cg[p.coll]||0)+(+p.amount||0)+(+p.fine||0));
  add('Wasooli',[H(['Wasooli','Kul jama']),...Object.entries(cg)]);
  const grid=[[...H(['Member No','Member','Phone']),...r.months.map(mLabel),L('Kul diya (Rs)'),L('baqi')]];
  list('member').sort((a,b)=>(+a.no||1e9)-(+b.no||1e9)).forEach(m=>{let tot=0,left=0;const cells=r.months.map(mm=>{const pd=paidFor(m.id,mm);tot+=pd;const active=m.active!==false&&(!m.joined||ym(m.joined)<=mm);if(active&&mm<=ym())left+=Math.max(0,(+m.amount||s.defAmount)-pd);return active?pd:'-'});grid.push([m.no||'',m.name,m.phone||'',...cells,tot,left])});
  add('Member-wise',grid);
  add('Members',[H(['Member No','Naam','Phone','CNIC','Ghar ka pata','Shamil','Ghar ke afraad','Waris / Nominee','Chhor diya']),...list('member').sort((a,b)=>(+a.no||1e9)-(+b.no||1e9)).map(m=>[m.no||'',m.name,m.phone||'',m.cnic||'',m.address||'',m.joined||'',(m.fam||[]).map(f=>f.name+' ('+L(f.rel)+(f.died?', '+L('Faut'):'')+')').join(', ')+(m.family?' '+m.family:''),m.nom?m.nom+' ('+(m.nomrel||'')+') '+(m.nomph||''):'',m.left||(m.died?L('Faut'):'')])]);
  const bq=[H(['Mahina','Member No','Member','Phone','Baqi raqam'])];r.months.filter(mm=>mm<=ym()).forEach(mm=>dueList(mm).forEach(x=>bq.push([mLabel(mm),x.m.no||'',x.m.name,x.m.phone||'',x.left])));add('Baqaya',bq);
  add('Wafat',[[...H(['Tareekh','Marhoom','Rishta','Member']),...DITEMS.map(x=>L(x[1])),L('Kul'),L('Note')],...list('death').filter(d=>inR(d.date)).map(d=>{const c=d.c||{};return [d.date,d.name,d.relation||'',memName(d.member),...DITEMS.map(x=>c[x[0]]||0),+d.amount,d.note||'']})]);
  add('Loan',[H(['Tareekh','Naam','Phone','Raqam','Qist','Ab tak wapas','Baqi (aaj)','Zamin','Note']),...list('loan').filter(l=>l.date<=r.to).map(l=>[l.date,l.member?memName(l.member):l.person,l.phone||'',+l.amount,l.inst||'',l.amount-loanLeft(l),loanLeft(l),l.guar||'',l.note||''])]);
  add('Loan wapsi',[H(['Tareekh','Naam','Raqam']),...list('loanpay').filter(p=>inR(p.date)).map(p=>{const l=get(p.loan)||{};return [p.date,l.member?memName(l.member):l.person,+p.amount]})]);
  add('Kharche',[H(['Tareekh','Kis cheez ka','Raqam','Note']),...list('expense').filter(e=>inR(e.date)).map(e=>[e.date,e.title,+e.amount,e.note||''])]);
  add('Doosri aamdani',[H(['Tareekh','Qisam','Kis cheez ki','Raqam','Note']),...list('income').filter(e=>inR(e.date)).map(e=>[e.date,L(e.itype||'Atiya'),e.title,+e.amount,e.note||''])]);
  add('Uhdedaran',[H(['Uhda','Naam','Phone','Kab se','Kab tak']),...list('officer').map(o=>[L(o.post),o.name,o.phone||'',o.from||'',o.to||''])]);
  XLSX.writeFile(wb,'Death-Committee-'+r.label.replace(/\s+/g,'-')+'.xlsx');
}

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._inst=e});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
start();
