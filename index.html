<style>
:root{--g:#0a9a4a;--gd:#067a39;--gl:#e7f7ee;--bg:#f2f4f3;--tx:#1d2b24;--mut:#6b7a72;--red:#d93838;--redl:#fdecec;--or:#e98a15;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--tx);padding-bottom:78px;font-size:15px}
body.ur *{font-family:"Noto Nastaliq Urdu",system-ui,sans-serif}
body.ur{line-height:1.9}
body.ur .amt,body.ur .amt-g,body.ur .amt-r,body.ur input{font-family:system-ui,sans-serif}
header{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;padding:16px 16px 54px;border-radius:0 0 22px 22px}
header .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:18px;font-weight:700}
header small{opacity:.85}
.bal{background:#fff;color:var(--tx);margin:-42px 14px 12px;border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.bal .lbl{color:var(--mut);font-size:13px}
.bal .amt{font-size:28px;font-weight:800;color:var(--gd);margin-top:2px}
.row{display:flex;gap:10px}.row>*{flex:1}
.mini{background:var(--gl);border-radius:12px;padding:10px;margin-top:10px}
.mini b{display:block;font-size:16px}.mini span{font-size:12px;color:var(--mut)}
.wrap{padding:0 14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tile{background:#fff;border-radius:14px;padding:12px 4px;text-align:center;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.05);cursor:pointer}
.tile .ic{width:42px;height:42px;border-radius:50%;background:var(--gl);color:var(--gd);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:20px}
h2{font-size:16px;margin:14px 0 8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eef1ef}
.item:last-child{border-bottom:0}
.item .n{font-weight:600}.item .s{font-size:12px;color:var(--mut)}
.amt-g{color:var(--gd);font-weight:700}.amt-r{color:var(--red);font-weight:700}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--gl);color:var(--gd);white-space:nowrap}
.badge.r{background:var(--redl);color:var(--red)}.badge.o{background:#fff3e2;color:var(--or)}
button{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer;background:var(--g);color:#fff}
button.sec{background:var(--gl);color:var(--gd)}button.red{background:var(--red)}button.wa{background:#25d366}
button.sm{padding:6px 10px;font-size:13px}
button.full{width:100%;margin-top:8px}
button.hb{background:rgba(255,255,255,.2);color:#fff;padding:7px 11px;font-size:14px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d6ddd9;border-radius:10px;font-size:15px;margin:4px 0 10px;background:#fff}
label{font-size:13px;color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;box-shadow:0 -2px 10px rgba(0,0,0,.07);z-index:5}
nav a{flex:1;text-align:center;padding:8px 0 10px;font-size:11px;color:var(--mut);text-decoration:none;cursor:pointer}
nav a .ic{font-size:20px;display:block}
nav a.on{color:var(--g);font-weight:700}
.fab{position:fixed;right:18px;bottom:88px;width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 4px 12px rgba(10,154,74,.4);z-index:6}
[dir=rtl] .fab{right:auto;left:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:10}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
.sheet h3{margin-bottom:12px}
.search{margin:0 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow:auto}
.tabs span{padding:7px 12px;border-radius:20px;background:#fff;font-size:13px;white-space:nowrap;cursor:pointer}
.tabs span.on{background:var(--g);color:#fff}
.empty{text-align:center;color:var(--mut);padding:24px 0}
.demo{background:#fff3e2;color:#8a5200;font-size:12px;text-align:center;padding:6px}
#login{max-width:380px;margin:60px auto;padding:0 18px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1d2b24;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:20}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:10px}.chk input{width:auto;margin:0}
.lang{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:10px;padding:16px;font-size:17px;background:var(--gl);color:var(--gd);border:2px solid transparent}
.lang.on{border-color:var(--g)}
.lang .ur{font-family:"Noto Nastaliq Urdu",serif;font-size:19px}
</style>
</head>

let sb=null, DEMO=!SUPABASE_URL, ROWS=[];
const LS='dc_records_v1';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function list(kind){return ROWS.filter(r=>r.kind===kind).map(r=>({...r.data,id:r.id}))}
function get(id){const r=ROWS.find(x=>x.id===id);return r?{...r.data,id:r.id}:null}
async function save(kind,obj){
  const id=obj.id||uid(); const data={...obj}; delete data.id;
  const row={id,kind,data};
  const i=ROWS.findIndex(r=>r.id===id); if(i>=0)ROWS[i]=row; else ROWS.push(row);
  if(DEMO) localStorage.setItem(LS,JSON.stringify(ROWS));
  else { const {error}=await sb.from('records').upsert({id,kind,data,updated_at:new Date().toISOString()}); if(error){alert(L('Save nahi hua')+': '+error.message);} }
  return id;
}
async function del(id){
  ROWS=ROWS.filter(r=>r.id!==id);
  if(DEMO) localStorage.setItem(LS,JSON.stringify(ROWS));
  else { const {error}=await sb.from('records').delete().eq('id',id); if(error)alert(error.message); }
}
async function loadAll(){
  if(DEMO){ROWS=JSON.parse(localStorage.getItem(LS)||'[]');return}
  let all=[],from=0;
  while(true){const {data,error}=await sb.from('records').select('id,kind,data').range(from,from+999);
    if(error){alert(error.message);break} all=all.concat(data); if(data.length<1000)break; from+=1000;}
  ROWS=all;
}

/* ================= CALCULATIONS ================= */
function totals(from,to){
  const inR=d=>(!from||d>=from)&&(!to||d<=to);
  const sum=k=>list(k).filter(p=>inR(p.date)).reduce((a,p)=>a+(+p.amount||0),0);
  const pay=sum('payment'),inc=sum('income'),lr=sum('loanpay'),dth=sum('death'),ln=sum('loan'),exp=sum('expense');
  return {pay,inc,lr,dth,ln,exp,in:pay+inc+lr,out:dth+ln+exp,bal:pay+inc+lr-dth-ln-exp};
}
function paidFor(memberId,month){return list('payment').filter(p=>p.member===memberId&&p.month===month).reduce((a,p)=>a+(+p.amount||0),0)}
function dueList(month){
  return list('member').filter(m=>m.active!==false&&(!m.joined||ym(m.joined)<=month)).map(m=>{
    const amt=+m.amount||S().defAmount, paid=paidFor(m.id,month);
    return {m,amt,paid,left:amt-paid};
  }).filter(x=>x.left>0);
}
function memberArrears(m){
  if(m.active===false)return [];
  const cur=ym(); let mm=ym(m.joined||today()), out=[];
  while(mm<=cur){const amt=+m.amount||S().defAmount,left=amt-paidFor(m.id,mm);if(left>0)out.push({month:mm,left});mm=addM(mm,1)}
  return out;
}
function loanLeft(l){return (+l.amount||0)-list('loanpay').filter(p=>p.loan===l.id).reduce((a,p)=>a+(+p.amount||0),0)}

  <label>${L('Saal')}</label><select id="r_y" onchange="rPrev()">${ys.map(v=>`<option>${v}</option>`).join('')}</select>
  <div id="r_pbox"><label>${L('Kaunsa')}</label><select id="r_p" onchange="rPrev()"></select></div>
  <div id="r_prev" class="card" style="background:var(--gl)"></div>
  <button class="full" onclick="exportX()">⬇️ ${L('Excel download')}</button></div></div>`;
  rOpts();
};
function rOpts(){const t=val('r_t'),p=$('#r_p'),M=MN[LANG];$('#r_pbox').style.display=t==='y'?'none':'block';
  p.innerHTML=t==='m'?M.map((m,i)=>`<option value="${i}" ${i===new Date().getMonth()?'selected':''}>${m}</option>`).join('')
   :t==='q'?[0,1,2,3].map(i=>`<option value="${i}">Q${i+1} (${M[i*3]} - ${M[i*3+2]})</option>`).join('')
   :[L('Pehle 6 mahine (Jan-Jun)'),L('Doosre 6 mahine (Jul-Dec)')].map((m,i)=>`<option value="${i}">${m}</option>`).join('');rPrev()}
function rRange(){const t=val('r_t'),y=+val('r_y'),p=+($('#r_p').value||0);let s,n;
  if(t==='m'){s=p;n=1}else if(t==='q'){s=p*3;n=3}else if(t==='h'){s=p*6;n=6}else{s=0;n=12}
  const months=[];for(let i=0;i<n;i++)months.push(y+'-'+String(s+i+1).padStart(2,'0'));
  return {months,from:months[0]+'-01',to:months[n-1]+'-31',label:t==='y'?L('Saal')+' '+y:n===1?mLabel(months[0]):mLabel(months[0])+' '+L('se')+' '+mLabel(months[n-1])}}
function rPrev(){const r=rRange(),t=totals(r.from,r.to);
  $('#r_prev').innerHTML=`<b>${r.label}</b><div class="item"><span>${L('Chanda')}</span><span class="amt-g">${rs(t.pay)}</span></div><div class="item"><span>${L('Doosri aamdani + loan wapsi')}</span><span class="amt-g">${rs(t.inc+t.lr)}</span></div><div class="item"><span>${L('Wafat kharch')}</span><span class="amt-r">${rs(t.dth)}</span></div><div class="item"><span>${L('Loan diye')}</span><span class="amt-r">${rs(t.ln)}</span></div><div class="item"><span>${L('Doosre kharche')}</span><span class="amt-r">${rs(t.exp)}</span></div><div class="item"><b>${L('Bachat')}</b><b>${rs(t.bal)}</b></div>`}
function exportX(){
  const r=rRange(),t=totals(r.from,r.to),inR=d=>d>=r.from&&d<=r.to,s=S(),wb=XLSX.utils.book_new();
  const opening=totals(null,addM(r.months[0],-1)+'-31').bal;
  const add=(name,rows)=>{const ws=XLSX.utils.aoa_to_sheet(rows.length>1?rows:[...rows,[L('(koi record nahi)')]]);if(LANG==='ur')ws['!views']=[{RTL:true}];XLSX.utils.book_append_sheet(wb,ws,L(name).slice(0,31))};
  const H=a=>a.map(L);
  add('Khulasa',[[s.name+' - '+r.label],[],[L('Shuru ka balance'),opening],[L('Chanda'),t.pay],[L('Doosri aamdani'),t.inc],[L('Loan wapsi'),t.lr],[L('Kul aamdani'),t.in],[],[L('Wafat kharch'),t.dth],[L('Loan diye'),t.ln],[L('Doosre kharche'),t.exp],[L('Kul kharch'),t.out],[],[L('Is muddat ki bachat'),t.bal],[L('Aakhri balance'),opening+t.bal]]);
  add('Chanda',[H(['Tareekh','Member No','Member','Mahina','Raqam','Tareeqa','Txn ID','Note']),...list('payment').filter(p=>inR(p.date)).sort((a,b)=>a.date.localeCompare(b.date)).map(p=>{const m=get(p.member)||{};return [p.date,m.no||'',m.name||'',mLabel(p.month),+p.amount,p.method==='online'?L('Online'):L('Cash'),p.txn||'',p.note||'']})]);
  const grid=[[...H(['Member No','Member','Phone']),...r.months.map(mLabel),L('Kul diya (Rs)'),L('baqi')]];
  list('member').sort((a,b)=>(+a.no||1e9)-(+b.no||1e9)).forEach(m=>{let tot=0,left=0;const cells=r.months.map(mm=>{const pd=paidFor(m.id,mm);tot+=pd;const active=m.active!==false&&(!m.joined||ym(m.joined)<=mm);if(active&&mm<=ym())left+=Math.max(0,(+m.amount||s.defAmount)-pd);return active?pd:'-'});grid.push([m.no||'',m.name,m.phone||'',...cells,tot,left])});
  add('Member-wise',grid);
  const bq=[H(['Mahina','Member No','Member','Phone','Baqi raqam'])];r.months.filter(mm=>mm<=ym()).forEach(mm=>dueList(mm).forEach(x=>bq.push([mLabel(mm),x.m.no||'',x.m.name,x.m.phone||'',x.left])));add('Baqaya',bq);
  add('Wafat',[[...H(['Tareekh','Marhoom','Rishta','Member']),...DITEMS.map(x=>L(x[1])),L('Kul'),L('Note')],...list('death').filter(d=>inR(d.date)).map(d=>{const c=d.c||{};return [d.date,d.name,d.relation||'',memName(d.member),...DITEMS.map(x=>c[x[0]]||0),+d.amount,d.note||'']})]);
  add('Loan',[H(['Tareekh','Naam','Phone','Raqam','Qist','Ab tak wapas','Baqi (aaj)','Zamin','Note']),...list('loan').filter(l=>l.date<=r.to).map(l=>[l.date,l.member?memName(l.member):l.person,l.phone||'',+l.amount,l.inst||'',l.amount-loanLeft(l),loanLeft(l),l.guar||'',l.note||''])]);
  add('Loan wapsi',[H(['Tareekh','Naam','Raqam']),...list('loanpay').filter(p=>inR(p.date)).map(p=>{const l=get(p.loan)||{};return [p.date,l.member?memName(l.member):l.person,+p.amount]})]);
  add('Kharche',[H(['Tareekh','Kis cheez ka','Raqam','Note']),...list('expense').filter(e=>inR(e.date)).map(e=>[e.date,e.title,+e.amount,e.note||''])]);
  add('Doosri aamdani',[H(['Tareekh','Kis cheez ki','Raqam','Note']),...list('income').filter(e=>inR(e.date)).map(e=>[e.date,e.title,+e.amount,e.note||''])]);
  XLSX.writeFile(wb,'Death-Committee-'+r.label.replace(/\s+/g,'-')+'.xlsx');
}

start();
</script>
